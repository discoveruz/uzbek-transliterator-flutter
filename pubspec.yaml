name: yangi_alifbo
description: "Writes Uzbek text and Word documents in the new Latin alphabet (Ö, Ğ, Ş, Ç), from old Latin and from Cyrillic."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Builds the Rust code in rust/ and bundles it with the app.
  rust_lib_yangi_alifbo:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  desktop_drop: ^0.8.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # The Word document that integration_test/simple_test.dart converts.
  assets:
    - integration_test/hello.docx
    - integration_test/sample.xlsx
